project:
  name: sparse-view-3dgs-regime-study
  version: v0.1
  experiment_id: regime-map-20260806

runtime:
  pose_mode: pose_given
  cuda_warmup: true
  exclude_initial_compilation: true
  data_root: /data/Re-feem

protocol:
  dataset_primary: RE10K
  image_resolution_policy:
    main_re10k: [256, 256]
    dl3dv_depthsplat: [256, 448]
    dtu_sanity_original: [1200, 1600]
    note: "Follow feed-forward checkpoint training resolution; per-scene optimization must use the same images for fair comparison."
  dataset_external: DTU
  dataset_primary_path: /data/Re-feem/datasets/re10k
  dataset_external_path: /data/Re-feem/datasets/dtu
  scenes_primary: 30
  scenes_external: 8
  dtu_official_split: [1, 8, 21, 30, 31, 34, 38, 40, 41, 45, 55, 63, 82, 103, 110, 114]
  seeds: [0, 1]
  # 2026-08-13: 20 scene x 3 seed -> 30 scene x 2 seed로 전환. scene x seed = 60으로 동일해
  # trajectory 수/GPU-hour는 변하지 않지만(20x3=30x2), scene-cluster bootstrap CI는 sqrt(20/30)
  # 배율(약 18% 폭 감소)만큼 좁아진다. seed는 반복측정이라 CI에 거의 기여하지 않고
  # scene만 독립 단위이므로(overall.md §5.12) 같은 예산에서 통계적 힘만 커지는 변경.
  # 근거: overall.md §9 축소 순서(seed 3->2가 1순위) + 실측 pilot wall-clock 검증.
  view_counts: [2, 4, 8, 12]
  overlap_levels: [low, high]
  budgets_seconds: [1, 10, 60, 300]
  time_boundary: end_to_end
  checkpoint_rule: budget_end_checkpoint
  use_oracle_peak: false

methods:
  feedforward:
    - DepthSplat
    - MVSplat
  optimization:
    - Vanilla3DGS
    - FSGS  # 2026-08-13: SparseGS 대신 FSGS 채택 확정 (수동 체크포인트 불필요 + --n_views CLI가 연구 축과 일치)
  control:
    refinement_on: true
    refinement_off: true

metrics:
  primary: [psnr, ssim, lpips]
  secondary: [reprojection_consistency, gaussian_count, peak_vram]
  external: [absrel, rmse, chamfer_distance, floater_ratio, free_space_opacity]

logging:
  schema:
    - experiment_id
    - scene
    - seed
    - method
    - iteration
    - wall_clock
    - train_loss
    - validation_metric
    - test_psnr
    - test_ssim
    - test_lpips
    - gaussian_count
    - peak_vram
    - checkpoint_path
  output_dirs:
    main_results: main_results
    oracle_results: oracle_results
    logs: logs
    checkpoints: checkpoints
    audits: audits
    overlap: overlap

overlap:
  pairwise_formula: dice_covisibility
  min_common_points: 1
  non_edge_value: 0.0
  primary_statistic: mean_overlap_zero_included
  secondary_statistics: [q25_overlap, median_overlap_reference, zero_pair_ratio]
  stratify_thresholds_within_view_count: true
  isolated_view_policy: separate_from_main_aggregate
  texture_covariates: [gradient_energy]
  output_dir: overlap

analysis:
  cluster_unit: scene
  seed_handling: repeated_measure_within_scene
  bootstrap_iterations: 2000
  confidence: 0.95
  multiple_comparison_correction: Holm
  tau:
    pilot_seed_variability_psnr: 0.0
    practical_min_delta_psnr: 0.5
    rule: max_pilot_variability_and_practical_min_delta

c1b:
  enabled: true
  # 2026-08-13 최종 동결: 390개 view-PSNR 샘플(MVSplat/RE10K 240 + DepthSplat/DL3DV 150)
  # 실측 근거는 overall.md §5.8. 원래 MSE 0.0001은 파일럿 전 추정치였고 너무 타이트했다
  # (정상 cross-renderer noise도 자주 걸러냄) — PSNR 기준으로 교체.
  renderer_equivalence_tolerance_psnr_db: 33.0
  renderer_equivalence_tolerance: 0.0001  # legacy MSE 값, check_renderer_equivalence.py --tolerance로 여전히 지원되지만 기본은 PSNR 기준 사용
  initial_value_source: feedforward_gaussian
  refinement_budget_seconds: [10, 60, 300]

c2:
  enabled: true
  depth_noise_levels: [0.0, 0.01, 0.03, 0.05, 0.10]
  global_scale_bias: [0.9, 0.95, 1.0, 1.05, 1.1]
  claim_scope: sensitivity_analysis
  # 2026-08-12: main phase/C1-b와 동일한 단일 300s trajectory + budget_snapshots.
  # 근거는 overall.md §5.9 참고 (budget_seconds가 원래 매니페스트에 빠져 있던 항목).
  max_budget_seconds: 300
  budget_snapshots: [1, 10, 60, 300]
  representative_conditions:
    - 2view_low_overlap
    - 4view_low_overlap
    - 4view_high_overlap
    - 12view_high_overlap
